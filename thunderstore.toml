[config]
schemaVersion = "0.0.1"

[package]
namespace = "Creaton"
name = "Server_Manager"
versionNumber = "2.2.2"
description = "Read-only client mod compatibility and server-owned characters for Valheim Server Manager."
websiteUrl = "https://github.com/monokaijs/valheim-server-manager"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2350"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore/README.md"
outdir = "./build"

[[build.copy]]
source = "./.release/BepInEx"
target = "BepInEx"

[[build.copy]]
source = "./thunderstore/CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["client-side", "utility", "mods"]
