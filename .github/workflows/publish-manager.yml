name: Publish Manager Release
run-name: Publish Manager ${{ inputs.version || inputs.bump }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semantic version; leave blank to use bump
        required: false
        type: string
      bump:
        description: Semantic version component to increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: manager-release
  cancel-in-progress: false

jobs:
  release:
    name: Prepare release source
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Resolve release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          VERSION_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_VERSION" ]]; then
            if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release version: $REQUESTED_VERSION" >&2
              exit 1
            fi
            release_version="$REQUESTED_VERSION"
            echo "RELEASE_VERSION=$release_version" >>"$GITHUB_ENV"
            echo "release_version=$release_version" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          current=$(sed -n 's/.*<Version>\([0-9][0-9.]*\)<\/Version>.*/\1/p' Directory.Build.props)
          IFS=. read -r major minor patch <<<"$current"
          case "$VERSION_BUMP" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
          esac
          release_version="$major.$minor.$patch"
          echo "RELEASE_VERSION=$release_version" >>"$GITHUB_ENV"
          echo "release_version=$release_version" >>"$GITHUB_OUTPUT"
      - name: Record version in release source
        run: |
          ./scripts/set-version.sh "$RELEASE_VERSION"
      - name: Verify control plane and dashboard
        run: |
          dotnet test ValheimServerManager.slnx
          npm ci --prefix web
          npm run build --prefix web
      - name: Commit and tag release
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Directory.Build.props README.md thunderstore.toml docker/entrypoint.sh \
            plugins/ValheimServerManager.Bootstrap/ValheimServerManager.Bootstrap.csproj \
            plugins/ValheimServerManager.Bootstrap/BootstrapSynchronizer.cs \
            plugins/ValheimServerManager.RuntimeUpdater/ValheimServerManager.RuntimeUpdater.csproj \
            plugins/ValheimServerManager.RuntimeUpdater/RuntimeUpdaterPlugin.cs \
            plugins/ValheimServerManager.Server/ServerPlugin.cs \
            plugins/ValheimServerManager.Client/ClientPlugin.cs \
            src/ValheimServerManager/Program.cs \
            src/ValheimServerManager/Services/ClientModManifestService.cs \
            tests/ValheimServerManager.Tests/CoreTests.cs \
            web/src/main.tsx src/ValheimServerManager/wwwroot
          if ! git diff --cached --quiet; then
            git commit -m "Release manager ${RELEASE_VERSION}"
          fi
          git tag --annotate "v${RELEASE_VERSION}" --message "Valheim Server Manager ${RELEASE_VERSION}"
          git push origin HEAD:${GITHUB_REF_NAME} "v${RELEASE_VERSION}"

  publish-thunderstore:
    name: Publish matching Thunderstore package
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/publish-thunderstore.yml
    with:
      version: ${{ needs.release.outputs.release_version }}
      ref: v${{ needs.release.outputs.release_version }}
      create_tag: false
    secrets: inherit

  publish-container:
    name: Publish container image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ needs.release.outputs.release_version }}
      - name: Capture source revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish container image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release.outputs.release_version }}
            ghcr.io/${{ github.repository }}:v${{ needs.release.outputs.release_version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release.outputs.release_version }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub release
    needs: [release, publish-thunderstore, publish-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release.outputs.release_version }}
        run: |
          gh release create "v${RELEASE_VERSION}" \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "Valheim Server Manager ${RELEASE_VERSION}" \
            --generate-notes
