name: Check BepInExPack version

on:
  schedule:
    - cron: "21 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare pinned pack with Thunderstore
        run: python3 scripts/check-bepinex-pack.py --latest
