name: Inspection workspace
on:
  push:
    branches: [feat/live-inspection-mod-policy]
    paths: [.github/workflows/inspection-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar HEAD > /tmp/vsm-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: inspection-source
          path: /tmp/vsm-source.tar
          retention-days: 1
