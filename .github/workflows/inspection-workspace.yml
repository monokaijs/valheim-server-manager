name: Build and inspect
on:
  push:
    branches: [main, feat/live-inspection-mod-policy]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: inspection-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dashboard-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Regression tests
        run: dotnet test ValheimServerManager.slnx --logger trx --results-directory TestResults
      - name: Dashboard typecheck and production build
        run: npm ci --prefix web && npm run build --prefix web
      - name: Install browser test tools
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Inspect real dashboard with simulated game data
        run: python3 scripts/test-dashboard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspection-test-results
          path: TestResults
          retention-days: 7
  game-plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install SteamCMD dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y lib32gcc-s1 lib32stdc++6
      - uses: actions/cache/restore@v4
        id: references
        with:
          path: |
            .valheim/valheim_server_Data/Managed
            .bepinex/BepInExPack_Valheim/BepInEx
          key: inspection-game-references-2026-09-23
      - name: Acquire game and BepInEx references
        if: steps.references.outputs.cache-hit != 'true'
        run: |
          mkdir -p .steamcmd .valheim .bepinex
          curl --fail --location --retry 3 https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz -C .steamcmd
          for attempt in 1 2 3; do
            .steamcmd/steamcmd.sh +@ShutdownOnFailedCommand 1 +@sSteamCmdForcePlatformType linux +force_install_dir "$GITHUB_WORKSPACE/.valheim" +login anonymous +app_update 896660 -beta public validate +quit && break
            test "$attempt" != 3 || exit 1
          done
          test -f .valheim/valheim_server_Data/Managed/assembly_valheim.dll
          curl --fail --location --retry 3 https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/5.4.2350/ -o /tmp/bepinex.zip
          unzip -q /tmp/bepinex.zip -d .bepinex
      - uses: actions/cache/save@v4
        if: steps.references.outputs.cache-hit != 'true'
        with:
          path: |
            .valheim/valheim_server_Data/Managed
            .bepinex/BepInExPack_Valheim/BepInEx
          key: inspection-game-references-2026-09-23
      - name: Compile server, client and runtime updater
        run: |
          result=0
          for project in Server Client RuntimeUpdater; do
            dotnet build "plugins/ValheimServerManager.$project/ValheimServerManager.$project.csproj" -c Release -p:ValheimManaged="$PWD/.valheim/valheim_server_Data/Managed" -p:BepInExRoot="$PWD/.bepinex/BepInExPack_Valheim/BepInEx" || result=1
          done
          exit "$result"
