name: Recover container publication
run-name: Recover container ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version whose container publication failed
        required: true
        type: string
      source_sha:
        description: Full immutable SHA containing only packaging fixes after the release tag
        required: true
        type: string
      update_latest:
        description: Also update latest (only for the newest stable release)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Serialize with the normal release workflow; never cancel a publication.
concurrency:
  group: manager-release
  cancel-in-progress: false

jobs:
  publish-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Validate recovery inputs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Version must be X.Y.Z.' >&2
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Source must be a full immutable commit SHA.' >&2
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Verify existing release and fixed source
        id: source
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        shell: bash
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          test "$revision" = "$SOURCE_SHA"
          release_tag="v${RELEASE_VERSION}"
          git rev-parse --verify "refs/tags/$release_tag" >/dev/null
          git merge-base --is-ancestor "$release_tag" HEAD
          # Keep the app/mod source identical to the already-published version.
          unexpected=$(git diff --name-only "$release_tag" HEAD -- . ':!Dockerfile' ':!.dockerignore')
          if [[ -n "$unexpected" ]]; then
            echo "Recovery source changes more than Docker packaging:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          source_version=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("Directory.Build.props").findtext("./PropertyGroup/Version"))')
          test "$source_version" = "$RELEASE_VERSION"
          if [[ "$UPDATE_LATEST" == true ]]; then
            newest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            test "$newest" = "$release_tag"
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<IMAGE_TAGS'
            echo "ghcr.io/${GITHUB_REPOSITORY}:${RELEASE_VERSION}"
            echo "ghcr.io/${GITHUB_REPOSITORY}:v${RELEASE_VERSION}"
            if [[ "$UPDATE_LATEST" == true ]]; then
              echo "ghcr.io/${GITHUB_REPOSITORY}:latest"
            fi
            echo IMAGE_TAGS
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish fixed container
        id: build
        uses: docker/build-push-action@v6
        env:
          # Recovery must not depend on Actions artifact storage being available.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.source.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
      - name: Record publication result
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.revision }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          {
            echo "Published container ${RELEASE_VERSION}"
            echo "Source: ${SOURCE_SHA}"
            echo "Digest: ${IMAGE_DIGEST}"
            echo 'Existing Git tags and Thunderstore packages were left unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-dockerhub:
    name: Mirror fixed container to Docker Hub
    if: ${{ vars.DOCKERHUB_ENABLED == 'true' }}
    needs: publish-container
    uses: ./.github/workflows/mirror-dockerhub.yml
    with:
      version: ${{ inputs.version }}
      digest: ${{ needs.publish-container.outputs.digest }}
      update_latest: ${{ inputs.update_latest }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
