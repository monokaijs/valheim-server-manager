name: Publish to Thunderstore
run-name: Publish Server Manager ${{ inputs.version || inputs.bump }}

on:
  workflow_call:
    inputs:
      version:
        description: Exact semantic version to publish
        required: true
        type: string
      ref:
        description: Git ref containing the release source
        required: false
        type: string
        default: ""
      create_tag:
        description: Create the matching Git tag after publishing
        required: false
        type: boolean
        default: false
      build_only:
        description: Build a review ZIP without publishing
        required: false
        type: boolean
        default: false
    secrets:
      THUNDERSTORE_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Exact semantic version; leave blank to use bump
        required: false
        type: string
      bump:
        description: Semantic version component to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      create_tag:
        description: Create the matching Git tag after publishing
        required: true
        default: true
        type: boolean
      build_only:
        description: Build a review ZIP without publishing
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: thunderstore-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          VERSION_BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$REQUESTED_VERSION" ]]; then
            if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release version: $REQUESTED_VERSION" >&2
              exit 1
            fi
            echo "RELEASE_VERSION=$REQUESTED_VERSION" >> "$GITHUB_ENV"
            echo "Publishing Server Manager $REQUESTED_VERSION"
            exit 0
          fi

          base_version=$(sed -n 's/^versionNumber = "\([0-9][0-9.]*\)"$/\1/p' thunderstore.toml)
          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [[ -n "$latest_tag" ]]; then
            base_version=${latest_tag#v}
          else
            package_url=https://thunderstore.io/api/experimental/package/Creaton/Server_Manager/
            if package_json=$(curl --fail --location --silent "$package_url"); then
              base_version=$(jq -er '.latest.version_number' <<<"$package_json")
            fi
          fi

          IFS=. read -r major minor patch <<<"$base_version"
          case "$VERSION_BUMP" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
            *) echo "Unsupported version bump: $VERSION_BUMP" >&2; exit 1 ;;
          esac

          release_version="$major.$minor.$patch"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "Publishing Server Manager $release_version"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lib32gcc-s1 lib32stdc++6

      - name: Download Valheim dedicated server references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .steamcmd .valheim
          curl --fail --location --silent --show-error \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            | tar -xz -C .steamcmd

          for attempt in 1 2 3; do
            if ./.steamcmd/steamcmd.sh \
              +@ShutdownOnFailedCommand 1 \
              +@sSteamCmdForcePlatformType linux \
              +force_install_dir "$GITHUB_WORKSPACE/.valheim" \
              +login anonymous \
              +app_update 896660 -beta public validate \
              +quit; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "SteamCMD failed after $attempt attempts." >&2
              exit 1
            fi
            echo "SteamCMD attempt $attempt failed; retrying with the existing download."
            sleep $((attempt * 10))
          done

      - name: Download BepInEx references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .bepinex
          curl --fail --location --silent --show-error \
            https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/5.4.2350/ \
            --output .bepinex.zip
          unzip -q .bepinex.zip -d .bepinex

      - name: Build Server Manager package files
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e \
            's/(PluginVersion = ")[0-9]+\.[0-9]+\.[0-9]+(";)/$1$ENV{RELEASE_VERSION}$2/' \
            plugins/ValheimServerManager.Client/ClientPlugin.cs
          mkdir -p .release/BepInEx/plugins/ServerManager
          dotnet build plugins/ValheimServerManager.Client/ValheimServerManager.Client.csproj \
            --configuration Release \
            --property:ValheimManaged="$GITHUB_WORKSPACE/.valheim/valheim_server_Data/Managed" \
            --property:BepInExRoot="$GITHUB_WORKSPACE/.bepinex/BepInExPack_Valheim/BepInEx" \
            --output .release-client
          dotnet build plugins/ValheimServerManager.Server/ValheimServerManager.Server.csproj \
            --configuration Release \
            --property:ValheimManaged="$GITHUB_WORKSPACE/.valheim/valheim_server_Data/Managed" \
            --property:BepInExRoot="$GITHUB_WORKSPACE/.bepinex/BepInExPack_Valheim/BepInEx" \
            --output .release-server
          cp .release-client/ValheimServerManager.Client.dll .release/BepInEx/plugins/ServerManager/
          cp .release-client/Newtonsoft.Json.dll .release/BepInEx/plugins/ServerManager/
          find .release -type f -name '*.pdb' -delete
          python3 plugins/make_icon.py thunderstore/icon.png

      - name: Install Thunderstore CLI
        shell: bash
        run: dotnet tool install tcli --tool-path ./.tcli --version 0.2.4

      - name: Publish package
        if: ${{ !inputs.build_only }}
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TCLI_AUTH_TOKEN"
          ./.tcli/tcli publish \
            --config-path thunderstore.toml \
            --package-version "$RELEASE_VERSION"

      - name: Build review package
        if: ${{ inputs.build_only }}
        shell: bash
        run: ./.tcli/tcli build --config-path thunderstore.toml --package-version "$RELEASE_VERSION"

      - name: Upload review package
        if: ${{ inputs.build_only }}
        uses: actions/upload-artifact@v4
        with:
          name: Server_Manager-review-${{ env.RELEASE_VERSION }}
          path: build/Creaton-Server_Manager-${{ env.RELEASE_VERSION }}.zip

      - name: Record published version
        if: ${{ inputs.create_tag && !inputs.build_only }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --annotate "v$RELEASE_VERSION" --message "Server Manager $RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"
