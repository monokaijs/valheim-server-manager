name: Mirror existing container to Docker Hub
run-name: Mirror container ${{ inputs.version }} to Docker Hub

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      digest:
        required: true
        type: string
      update_latest:
        default: false
        type: boolean
    secrets:
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Existing GHCR image version (no version bump or rebuild)
        required: true
        type: string
      digest:
        description: Exact published GHCR sha256 digest to mirror
        required: true
        type: string
      update_latest:
        description: Also mirror latest, only if GHCR latest still matches this digest
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Separate from the caller's release lock to avoid reusable-workflow deadlocks.
concurrency:
  group: dockerhub-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify mirror safety checks
        run: python3 -m unittest discover -s tests -p test_mirror_container.py
      - name: Check Docker Hub token is configured
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo 'DOCKERHUB_TOKEN must contain the manually managed write PAT for monokaijs.' >&2
            exit 1
          fi
      - name: Install registry copy tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: monokaijs
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy the published image without rebuilding
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          IMAGE_DIGEST: ${{ inputs.digest }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          export REGISTRY_AUTH_FILE="$HOME/.docker/config.json"
          bash scripts/mirror-container.sh
