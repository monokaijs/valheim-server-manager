services:
  valheim-manager:
    image: ${VSM_IMAGE:-ghcr.io/monokaijs/valheim-server-manager:latest}
    build: .
    container_name: valheim-server-manager
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-Valheim Server}
      SERVER_WORLD: ${SERVER_WORLD:-Dedicated}
      SERVER_PASSWORD: ${SERVER_PASSWORD:-}
      SERVER_PORT: ${SERVER_PORT:-2456}
      SERVER_PUBLIC: ${SERVER_PUBLIC:-1}
      SERVER_CROSSPLAY: ${SERVER_CROSSPLAY:-false}
      SERVER_INSTANCE_ID: ${SERVER_INSTANCE_ID:-}
      SERVER_SAVE_INTERVAL: ${SERVER_SAVE_INTERVAL:-1800}
      SERVER_BACKUPS: ${SERVER_BACKUPS:-4}
      SERVER_BACKUP_SHORT: ${SERVER_BACKUP_SHORT:-7200}
      SERVER_BACKUP_LONG: ${SERVER_BACKUP_LONG:-43200}
      SERVER_MAX_PLAYERS: ${SERVER_MAX_PLAYERS:-10}
      SERVER_MANAGE_WORLD_MODIFIERS: ${SERVER_MANAGE_WORLD_MODIFIERS:-false}
      SERVER_PRESET: ${SERVER_PRESET:-normal}
      SERVER_MODIFIER_COMBAT: ${SERVER_MODIFIER_COMBAT:-}
      SERVER_MODIFIER_DEATH_PENALTY: ${SERVER_MODIFIER_DEATH_PENALTY:-}
      SERVER_MODIFIER_RESOURCES: ${SERVER_MODIFIER_RESOURCES:-}
      SERVER_MODIFIER_RAIDS: ${SERVER_MODIFIER_RAIDS:-}
      SERVER_MODIFIER_PORTALS: ${SERVER_MODIFIER_PORTALS:-}
      SERVER_SETKEY_NO_BUILD_COST: ${SERVER_SETKEY_NO_BUILD_COST:-false}
      SERVER_SETKEY_PLAYER_EVENTS: ${SERVER_SETKEY_PLAYER_EVENTS:-false}
      SERVER_SETKEY_PASSIVE_MOBS: ${SERVER_SETKEY_PASSIVE_MOBS:-false}
      SERVER_SETKEY_NO_MAP: ${SERVER_SETKEY_NO_MAP:-false}
      VSM_UPDATE_ON_START: ${VSM_UPDATE_ON_START:-true}
      VSM_PUBLIC_URL: ${VSM_PUBLIC_URL:-}
      VSM_UPDATE_REPOSITORY: ${VSM_UPDATE_REPOSITORY:-monokaijs/valheim-server-manager}
      VSM_REQUIRE_INVENTORY_INSPECTION: ${VSM_REQUIRE_INVENTORY_INSPECTION:-true}
      VSM_SERVER_CHARACTERS_ENABLED: ${VSM_SERVER_CHARACTERS_ENABLED:-false}
      VSM_SERVER_CHARACTERS_ACCEPT_FIRST_JOIN: ${VSM_SERVER_CHARACTERS_ACCEPT_FIRST_JOIN:-true}
      VSM_SERVER_CHARACTERS_REJECT_USED: ${VSM_SERVER_CHARACTERS_REJECT_USED:-false}
      VSM_SERVER_CHARACTERS_BACKUPS: ${VSM_SERVER_CHARACTERS_BACKUPS:-10}
      VSM_CLIENT_MOD_GRACE_SECONDS: ${VSM_CLIENT_MOD_GRACE_SECONDS:-20}
    ports:
      - "${VSM_HTTP_PORT:-8080}:8080/tcp"
      - "${SERVER_PORT:-2456}:${SERVER_PORT:-2456}/udp"
      - "${SERVER_QUERY_PORT:-2457}:${SERVER_QUERY_PORT:-2457}/udp"
      - "${SERVER_EXTRA_PORT:-2458}:${SERVER_EXTRA_PORT:-2458}/udp"
    volumes:
      - server-files:/data/server
      - worlds:/data/worlds
      - manager-data:/data/manager
      - server-logs:/data/logs
      - bepinex:/data/server/BepInEx
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5m

volumes:
  server-files:
  worlds:
  manager-data:
  server-logs:
  bepinex:
